name: sign-notarize-test

# End-to-end test: fetch Apple signing material with the HexSign CLI, then
# code sign a sample iOS app and code sign + notarize a sample macOS app.
#

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup HexSign CLI
        uses: ./
        with:
          client-id: ${{ secrets.HEXSIGN_CLIENT_ID }}
          client-secret: ${{ secrets.HEXSIGN_CLIENT_SECRET }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch iOS signing material
        id: fetch
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sign"
          # --keychain creates the keychain and imports the .p12; --install
          # copies the profile into ~/Library/MobileDevice/Provisioning Profiles.
          hexsign certificates download \
            --type DISTRIBUTION --team-id "$APPLE_TEAM_ID" \
            --output-dir "$RUNNER_TEMP/sign" \
            --keychain "$RUNNER_TEMP/hexsign-ci.keychain-db"
          hexsign profiles download \
            --bundle-id "$IOS_BUNDLE_ID" --team-id "$APPLE_TEAM_ID" \
            --output-dir "$RUNNER_TEMP/sign" --install | tee "$RUNNER_TEMP/profiles.out"
          # The installed filename is <UUID>.mobileprovision; the UUID works
          # directly as a PROVISIONING_PROFILE_SPECIFIER.
          installed="$(grep ' -> ' "$RUNNER_TEMP/profiles.out" | head -1 | sed 's/.* -> //')"
          uuid="$(basename "$installed" .mobileprovision)"
          if [ -z "$uuid" ]; then echo "::error::No profile installed"; exit 1; fi
          echo "profile_uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Resolve signing identity
        id: identity
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/hexsign-ci.keychain-db"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -i 'Distribution' | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then echo "::error::No distribution identity found in keychain"; exit 1; fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build, archive and export a signed .ipa
        working-directory: examples/ci-test/ios-app
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
          PROFILE_UUID: ${{ steps.fetch.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          xcodegen generate

          xcodebuild archive \
            -project HexSignTestiOS.xcodeproj \
            -scheme HexSignTestiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HexSignTestiOS.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key><false/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HexSignTestiOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa-export"

      - name: Verify the iOS signature
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP"/ipa-export/*.ipa | head -1)"
          echo "Produced: $IPA"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          APP="$(ls -d "$RUNNER_TEMP"/ipa-check/Payload/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP"

      - name: Upload the signed .ipa
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hexsign-test-ios
          path: ${{ runner.temp }}/ipa-export/*.ipa
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/hexsign-ci.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/sign" "$RUNNER_TEMP/profiles.out"

  notarize-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup HexSign CLI
        uses: ./
        with:
          client-id: ${{ secrets.HEXSIGN_CLIENT_ID }}
          client-secret: ${{ secrets.HEXSIGN_CLIENT_SECRET }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch Developer ID certificate
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sign"
          hexsign certificates download \
            --type DEVELOPER_ID_APPLICATION --team-id "$APPLE_TEAM_ID" \
            --output-dir "$RUNNER_TEMP/sign" \
            --keychain "$RUNNER_TEMP/hexsign-ci.keychain-db"

      - name: Resolve signing identity
        id: identity
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/hexsign-ci.keychain-db"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then echo "::error::No Developer ID Application identity found"; exit 1; fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build the macOS app (unsigned)
        working-directory: examples/ci-test/macos-app
        env:
          MACOS_BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build \
            -project HexSignTestMac.xcodeproj \
            -scheme HexSignTestMac \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            PRODUCT_BUNDLE_IDENTIFIER="$MACOS_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Code sign with the Developer ID identity
        env:
          IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release/HexSignTestMac.app"
          codesign --force --deep --options runtime --timestamp \
            --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"

          ZIP="$RUNNER_TEMP/HexSignTestMac.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP"

          xcrun notarytool submit "$ZIP" \
            --key "$KEY" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec --verbose=4 "$APP_PATH"

      - name: Package the notarized app
        if: always()
        run: |
          set -euo pipefail
          if [ -d "${APP_PATH:-}" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/HexSignTestMac-notarized.zip"
          fi

      - name: Upload the notarized app
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hexsign-test-macos
          path: ${{ runner.temp }}/HexSignTestMac-notarized.zip
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/hexsign-ci.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          rm -rf "$RUNNER_TEMP/sign"
